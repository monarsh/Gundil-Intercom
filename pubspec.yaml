name: p2p_intercom
description: "Gundil Intercom: peer-to-peer LAN push-to-talk intercom over TCP/IP for Linux, Windows and Android."
publish_to: 'none'
version: 1.12.0+31

environment:
  sdk: ^3.8.0

dependencies:
  file_picker: ^13.4.0
  flutter:
    sdk: flutter
  fvp: ^0.40.0
  intercom_audio:
    path: packages/intercom_audio
  intercom_core:
    path: packages/intercom_core
  logging: ^1.3.0
  mobile_scanner: ^7.5.0
  path_provider: ^2.1.6
  qr: ^4.0.1
  shared_preferences: ^2.3.0
  video_player: ^2.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
